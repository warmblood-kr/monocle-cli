name: npm publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: '빌드/검증만 하고 실제 배포는 생략'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  id-token: write

jobs:
  dry-run:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Publish to npm (dry run)
        run: npm publish --access public --provenance --dry-run

  publish:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
    runs-on: ubuntu-latest
    environment: npm-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm ci

      - name: Sync version from tag (release event)
        if: github.event_name == 'release'
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          TAG_VERSION="${TAG_NAME#v}"
          if ! echo "$TAG_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$TAG_NAME' is not a valid SemVer (expected 'v1.2.3' or 'v1.2.3-rc.1')"
            exit 1
          fi
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version
          echo "package.json version synced to $TAG_VERSION (CI-only, not committed)"

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public --provenance
